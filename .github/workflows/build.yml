# 윈도우에서 WPF 프로젝트 빌드 및 배포 파일을 검증합니다.
name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build EpicPen.csproj -c Release
      - name: Publish
        run: dotnet publish EpicPen.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: EpicPen-win-x64
          path: publish/
